<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{username}}'s Dashboard</title>
</head>
<body>
    <div class="container">
        <h1>{{username}}'s Life, Quantified!</h1>
        <h2>Your Current Trackers:</h2>
        
        <div>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Tracker Name</th>
                        <th scope="col">Tracker Type</th>
                        <th scope="col">Last Updated</th>
                        <th scope="col">Latest Tracker Value</th>
                        <th scope="col">Add a value</th>
                    </tr>
                </thead>
                <tbody>
                {% for tracker in all_track %}
                    <tr v-for="tracker in trackers">
                        <td>{{tracker[1]}}</td>
                        <td>{{tracker[2]}}</td>
                        <td>{{tracker[3]}}</td>
                        <td>{{tracker[4]}}</td>
                        <!-- <td><button type="button" onclick = "document.location= '/dashboard/{{tracker[0]}}/log'" class="btn btn-outline-dark"> Add Log
                            <button type="button" onclick = "document.location= '/dashboard/{{tracker[0]}}/log'" class="btn btn-outline-danger"> Delete Tracker</td>
                        --> <td>
                            <div class="btn-group" role="group" aria-label="Basic outlined example">
                                <button type="button" onclick = "document.location= '/dashboard/{{tracker[0]}}/details'" class="btn btn-outline-dark">Show Tracker Details</button>
                                <button type="button" onclick = "document.location= '/dashboard/{{tracker[0]}}/log'" class="btn btn-outline-primary">Add Log</button>
                            </div>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        <div class="container">
            <button type="button" onclick = "document.location='/dashboard/create_tracker'" class="btn btn-primary">Add a new Tracker</button>
        </div>
        <br>
        <button type="button" class="btn btn-warning">Update User Details</button>
        <button type="button" class="btn btn-danger">Delete {{username}}'s profile!!</button>
        <button type="button" onclick = "document.location='/logout'" class="btn btn-danger">Log Out</button>
    </div>
</body>
</html>
