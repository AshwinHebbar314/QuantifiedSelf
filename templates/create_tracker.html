<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Tracker</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/" style="padding-left: 20px;">QuantifiedSelf</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item active">
              <a class="nav-link" href="/dashboard">Dashboard<span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/login">Login</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/logout">log Out</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/signup">Sign-up</a>
            </li>
          </ul>
        </div>
      </nav>
    <div class="container">
        <h1>Create a new Tracker:</h1>
        <form method="POST">
            <div class="mb-3">
              <label for="Trackername" class="form-label">Tracker Name</label>
              <input type="text" class="form-control" id="tname" name = "tname" aria-describedby="tnamehelp" required="true">
              <div id="tnamehelp" class="form-text">This will be the name of the tracker</div>
            </div>
            <div class="mb-3">
                <label for="Tracker Description" class="form-label">Tracker Description</label>
                <input type="text" class="form-control" id="tdet" name = "tdet" aria-describedby="tdethelp">
                <div id="tdethelp" class="form-text">Describe the tracker in a few words</div>
            </div>
            <select class="form-select" aria-label="Default select example" name = "ttype" id = "ttype">
                <option selected>Open this select menu</option>
                <option value="1">Numerical</option>
                <option value="2">Multiple Choice</option>
                <option value="3">Time Duration</option>
                <option value="4">Boolean</option>
                <option value="5">Nominal/Unique</option>
              </select>
            <br>
            <input type="text" class="form-control" id="mulcho" name = "mulcho" placeholder="Enter the choices as space seperated values. Only valid of Tracker Type is 'Multiple Choice'">
            <br>
            <button type="submit" class="btn btn-primary">Submit</button>
        <form> 
    </div>
    <div class="container">
        <footer class="py-3 my-4">
          <ul class="nav justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item"><a href="/dashboard" class="nav-link px-2 text-muted">Dashboard</a></li>
            <li class="nav-item"><a href="/signout" class="nav-link px-2 text-muted">Signout</a></li>
            <li class="nav-item"><a href="https://github.com/AshwinHebbar314/QuantifiedSelf" class="nav-link px-2 text-muted">GitHub</a></li>
          </ul>
          <p class="text-center text-muted">&copy; 20222 Ashwin Hebbar, 21f1003155</p>
        </footer>
      </div>
</body>
</html>
