<div class="container d-flex h-100">
        <div class="container flex-column align-items-center h-100">
            <h1>Create a new Tracker:</h1>
            <form method="POST">
                <div class="mb-3">
                    <label for="Trackername" class="form-label">Tracker Name</label>
                    <input type="text" class="form-control" id="tname" name="tname" aria-describedby="tnamehelp"
                        required="true">
                    <div id="tnamehelp" class="form-text">This will be the name of the tracker</div>
                </div>
                <div class="mb-3">
                    <label for="Tracker Description" class="form-label">Tracker Description</label>
                    <input type="text" class="form-control" id="tdet" name="tdet" aria-describedby="tdethelp">
                    <div id="tdethelp" class="form-text">Describe the tracker in a few words</div>
                </div>
                <select class="form-select" aria-label="Default select example" name="ttype" id="ttype">
                    <option selected>Open this select menu</option>
                    <option value="1">Numerical</option>
                    <option value="2">Multiple Choice</option>
                    <option value="3">Time Duration</option>
                    <option value="4">Boolean</option>
                    <option value="5">Nominal/Unique</option>
                </select>
                <br>
                <input type="text" class="form-control" id="mulcho" name="mulcho"
                    placeholder="Enter the choices as space seperated values. Only valid of Tracker Type is 'Multiple Choice'">
                <br>
                <button type="submit" class="btn btn-primary">Submit</button>
                <form>
        </div>
