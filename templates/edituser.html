    <div class = "container">
        <form method="POST">
            <div class="container">
                <div class="form-group">
                    <label for="username">First Name</label>
                    <input name="fname" type="text" class="form-control" id="user_name" aria-describedby="emailHelp"
                        placeholder="Enter username" value="{{user.fname}}" required>
                <div class="form-group">
                    <label for="username">Last Name</label>
                    <input name="lname" type="text" class="form-control" id="user_name" aria-describedby="emailHelp"
                        placeholder="Enter username" value="{{user.lname}}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input name="user_name" type="text" class="form-control" id="user_name" aria-describedby="emailHelp"
                        placeholder="Enter username" value="{{user.name}}" required>

                </div>
                <div class="form-group">
                    <label for="InputEmail1">Password</label>
                    <input value="{{user.password}}"" name = "passw" type="password" class="form-control" id="InputEmail1"
                        aria-describedby="emailHelp" placeholder="Enter email">

                </div>
                <div class="form-group">
                    <label for="InputEmail1">Email Address</label>
                    <input value="{{user.email}}" name = "email" type="email" class="form-control" id="InputEmail1"
                        aria-describedby="emailHelp" placeholder="Enter email">
                    <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone
                        else.</small>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
        </form>
