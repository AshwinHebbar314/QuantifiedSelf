<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{tname}}: Add Log</title>
</head>
<body>
    <div class="container">
        <h1>EDIT Log: {{tname}}</h1>
        <form method = "POST">
            <div class="mb-3">
                <label for="tname" class="form-label">Tracker Name</label>
                <input type="text" class="form-control" id="tname" aria-describedby="tnamehelp" name = "tname" placeholder = "{{ tname }}" value = "{{ name }}" disabled>
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
              </div>
              <div class="mb-3">
                <label for="time" class="form-label">Log Time</label>
                <input type="text" class="form-control" id="time" aria-describedby="tnamehelp" name = "time" placeholder = "{{ timenow }}" value = "{{ timenow }}">
                <div id="emailHelp" class="form-text">We have filled the time for you, feel free to add your own time!</div>
              </div>
              <div class="mb-3">
                <label for="tval" class="form-label">Tracker Value</label>
                <input type="number" class="form-control" id="tval" aria-describedby="tvalhelp" name = "tval" placeholder = "Add the Logging Value Here" value = "{{log.value}}"required>
              </div>
              <div class="mb-3">
                <label for="tdet" class="form-label">Log Details</label>
                <input type="text" class="form-control" id="tdet" aria-describedby="tdethelp" name = "tdet" placeholder = "Add any more details about the current Log if needed" value = "{{log.data}}">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <br>


    </div>
    

</body>
</html>
